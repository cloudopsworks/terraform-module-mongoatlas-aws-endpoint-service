# Module-specific configuration for terraform-module-mongoatlas-aws-endpoint-service
# Loaded by terragrunt.hcl as local.local_vars.
# Do NOT include variables supplied by the Terragrunt hierarchy (is_hub, spoke_def, org, extra_tags).

# MongoDB Atlas project identification — provide at least one of the two below.
project_id: ""       # (Optional) MongoDB Atlas Project ID. Takes precedence over project_name when both are set.
project_name: ""     # (Optional) MongoDB Atlas Project Name. Used to look up project_id when project_id is not provided.

# (Required) The ID of the MongoDB Atlas PrivateLink endpoint resource.
# Typically sourced from a sibling `endpoint` module output (dependency.endpoint.outputs.private_link_id).
private_link_id: ""

# (Required) VPC configuration for the AWS VPC endpoint and security group.
# All sub-keys are required at runtime; typically sourced from a sibling `vpc` module.
vpc:
  vpc_id: ""          # (Required) AWS VPC ID where the VPC endpoint and security group will be created.
  vpc_cidr_block: ""  # (Required) Primary CIDR block of the VPC; added as an allowed ingress source on the security group.
  subnet_ids: []      # (Required) List of subnet IDs where the VPC endpoint network interfaces will be placed.

# (Optional) Endpoint and security group behaviour settings. All sub-keys are optional.
settings:
  security_group_ids: []   # (Optional) Additional security group IDs to associate with the VPC endpoint. default: []
  port: 1024               # (Optional) Start port for the security group ingress TCP rule (end is fixed at 65535). default: 1024
  vpc_cidr_blocks: []      # (Optional) Extra CIDR blocks allowed in the security group ingress rule. default: []
  private_dns: false       # (Optional) Enable private DNS on the VPC endpoint. default: false
  options:
    dns_record_ip_type: "service-defined"  # (Optional) IP address type for VPC endpoint DNS records.
                                           # Values: service-defined | ipv4 | dualstack | ipv6. default: "service-defined"
    private_resolver: false                # (Optional) Restrict private DNS resolution to inbound resolver endpoints only. default: false
